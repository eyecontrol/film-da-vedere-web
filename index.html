<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f0a0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Film da vedere">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Film da vedere</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="root">

  <!-- APP -->
  <div class="app" id="app">
    <div class="app-beams" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="scroll" id="scroll">
      <header class="top">
        <div class="brand">
          <div class="logo">Film da vedere<div class="mini-bulbs" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
          <div class="brand-r"><button class="link-btn" id="sync-btn" aria-label="Lista condivisa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/></svg><i></i></button>
          <div class="who" id="who" role="group" aria-label="Chi sta usando l'app">
            <button data-who="Lui" aria-pressed="true">Lui</button><button data-who="Lei" aria-pressed="false">Lei</button>
          </div></div>
        </div>
        <div class="searchrow">
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="q" type="search" placeholder="Cerca film e serie" autocomplete="off" enterkeyhint="search" aria-label="Cerca film e serie">
          </label>
          <button class="cancel" id="cancel" hidden>Chiudi</button>
        </div>
        <div class="seg" id="seg"><span class="knob"></span><button data-k="tutto" aria-pressed="true">Tutto</button><button data-k="film" aria-pressed="false">Film</button><button data-k="serie" aria-pressed="false">Serie</button></div>
        <div class="chips" id="chips"></div>
      </header>
      <main class="content" id="list"></main>
    </div>
    <nav class="dock" role="tablist">
      <button class="tab" role="tab" id="tab-todo" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 4v5M16 4v5"/></svg>
        <span>Da vedere <em id="n-todo"></em></span></button>
      <button class="dice" id="pick" aria-label="Scegli tu per noi">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>
      </button>
      <button class="tab" role="tab" id="tab-seen" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
        <span>Visti <em id="n-seen"></em></span></button>
    </nav>
  </div>

  <!-- SCHEDA -->
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="s-title">
    <div class="grab"></div>
    <div class="sheet-head">
      <div id="s-poster"></div>
      <div class="sheet-info"><h2 id="s-title"></h2><div class="meta" id="s-meta"></div></div>
    </div>
    <div class="where" id="s-where"></div>
    <p class="plot" id="s-plot"></p>
    <div class="actions" id="s-actions"></div>
  </div>
  <div class="scrim" id="d-scrim"></div>
  <div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="d-title"></div>
  <div class="toast" id="toast" role="status"></div>

  <!-- PROIEZIONE: scelta del film -->
  <div class="show" id="show" aria-live="polite">
    <div class="dimmer"></div>
    <div class="rig proj" aria-hidden="true"><i class="beam down"></i><i class="lamp small"></i></div>
    <div class="show-msg" id="show-msg"><span id="show-label">Si spengono le luci</span><big id="show-roll"></big></div>
    <div class="leader"><div class="sweep"></div><b id="count">3</b></div>
    <div class="feature">
      <div class="eyebrow">Stasera in sala</div>
      <div id="f-poster"></div>
      <h2 id="f-title"></h2>
      <div class="ticket" id="ticket">
        <div><strong id="f-date"></strong><span id="f-info"></span></div>
        <div>FILA F<br>7 · 8</div>
        <span class="stamp">CONVALIDATO</span>
      </div>
      <div class="choices">
        <button class="go" id="f-now">
          <span class="play"><i><svg viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0 10 6 0 12Z"/></svg></i></span>
          <span class="txt"><strong>Lo guardiamo ora!</strong><small>Fila F · posti 7 e 8</small></span>
        </button>
        <div class="alt">
          <button id="f-seen"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><path d="m9 12 2 2 4-4"/></svg></i><span><b>Già visto</b><small>Va nei visti</small></span></button>
          <button id="f-other"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></i><span><b>Scegline un altro</b><small>Nuova estrazione</small></span></button>
        </div>
        <button class="link" id="f-close">Torna alla lista</button>
      </div>
    </div>
  </div>

  <!-- LA SALA -->
  <div class="finale" id="finale" aria-live="polite">
    <svg class="room" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="wl" x1="0" x2="1"><stop offset="0" stop-color="#3a1a20"/><stop offset="1" stop-color="#1e0e12"/></linearGradient>
        <linearGradient id="wr" x1="1" x2="0"><stop offset="0" stop-color="#3a1a20"/><stop offset="1" stop-color="#1e0e12"/></linearGradient>
        <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0c10"/><stop offset="1" stop-color="#2a1016"/></linearGradient>
      </defs>
      <g class="wall">
        <polygon points="0,0 100,0 86,10 14,10" fill="#140a0d"/>
        <polygon points="0,0 14,10 14,48 0,70" fill="url(#wl)"/>
        <polygon points="100,0 86,10 86,48 100,70" fill="url(#wr)"/>
        <polygon points="14,10 86,10 86,48 14,48" fill="#100709"/>
        <polygon points="0,70 14,48 86,48 100,70 100,100 0,100" fill="url(#fl)"/>
        <g stroke="rgba(0,0,0,.45)" stroke-width=".35"><line x1="4" y1="2.9" x2="4" y2="63.7"/><line x1="8" y1="5.7" x2="8" y2="57.4"/><line x1="11.2" y1="8" x2="11.2" y2="52.4"/>
          <line x1="96" y1="2.9" x2="96" y2="63.7"/><line x1="92" y1="5.7" x2="92" y2="57.4"/><line x1="88.8" y1="8" x2="88.8" y2="52.4"/></g>
        <polygon points="7,36.6 12.2,40.3 12.2,50.8 7,59" fill="#0a0506"/><polygon points="7.5,37.7 11.7,40.7 11.7,50.6 7.5,57.7" fill="#140a0c"/>
      </g>
    </svg>
    <div class="house-glow"></div>
    <div class="exit-spill"></div>
    <div class="exit" id="exit" role="img" aria-label="Uscita di emergenza"><svg viewBox="0 0 24 14" aria-hidden="true"><path d="M15.5 1.5h7v11h-7z" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8.5" cy="2" r="1.6"/><path d="M7 4.2 4.4 7.6l1.4.8 1.7-2.1.7 2.8-2.4 3.8 1.4.8 2.6-4.1.7 2h2.8V10.2H11.4L10 4.8z"/><path d="M12.5 7h2.6" stroke="currentColor" stroke-width="1.2"/></svg></div>
    <div id="sconces"></div>
    <div class="screen-glow"></div>
    <div class="screen" id="screen">
      <img id="sc-img" alt="" hidden referrerpolicy="no-referrer">
      <div class="pre" id="pre">Tra poco in sala</div>
      <div class="sc-title"><b>Buona visione</b><span id="sc-film"></span></div>
      <div class="sc-credit">una produzione offerta da <b>CAIMEO Production</b></div>
    </div>
    <svg class="beamsvg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="bm" x1="0" y1="4" x2="0" y2="33" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="rgb(255,236,200)" stop-opacity=".55"/><stop offset=".35" stop-color="rgb(255,232,190)" stop-opacity=".22"/><stop offset="1" stop-color="rgb(255,232,190)" stop-opacity=".06"/></linearGradient>
        <radialGradient id="lens" cx="50" cy="4" r="3" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="rgb(255,236,200)" stop-opacity=".9"/><stop offset="1" stop-color="rgb(255,220,170)" stop-opacity="0"/></radialGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".35"/></filter>
      </defs>
      <!-- il proiettore è un punto (50,4) sul soffitto della cabina; il fascio finisce esattamente nei quattro angoli dello schermo: 18,13 · 82,13 · 82,33 · 18,33 -->
      <polygon points="50,4 82,13 82,33 18,33 18,13" fill="url(#bm)" filter="url(#soft)"/>
      <polygon points="50,4 18,13 18,33" fill="rgb(255,236,200)" opacity=".05"/>
      <polygon points="50,4 82,13 82,33" fill="rgb(255,236,200)" opacity=".05"/>
      <g fill="rgb(255,240,210)" opacity=".06" filter="url(#soft)">
        <polygon points="50,4 34,33 39,33"/><polygon points="50,4 55,33 59,33"/><polygon points="50,4 70,33 73,33"/>
      </g>
      <g stroke="rgb(255,236,200)" stroke-opacity=".45" stroke-width=".22" fill="none">
        <line x1="50" y1="4" x2="18" y2="13"/><line x1="50" y1="4" x2="82" y2="13"/><line x1="50" y1="4" x2="18" y2="33" stroke-opacity=".22"/><line x1="50" y1="4" x2="82" y2="33" stroke-opacity=".22"/>
      </g>
      <ellipse cx="50" cy="4" rx="3" ry="1.6" fill="url(#lens)"/>
    </svg>
    <div class="dust" id="dust"></div>
    <svg class="seats" id="seats" viewBox="0 0 390 340" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
    <div class="blackout"></div>
    <button class="reopen" id="reopen">Riapri l'app</button>
  </div>

  <!-- APERTURA -->
  <div class="intro" id="intro">
    <div class="stagebg"></div>
    <div class="curtain" id="curtain" aria-hidden="true"><div class="half l"></div><div class="half r"></div></div>
    <div class="spots" id="spots" aria-hidden="true"></div>
    <div class="valance"></div>
    <div class="fringe"></div>
    <div class="marquee-wrap">
      <div class="marquee" id="marquee">
        <div class="m-sub">Questa sera</div>
        <div class="m-title">Film da<br>vedere</div>
        <div class="m-now" id="m-now"></div>
      </div>
      <button class="enter" id="enter">Entra in sala</button>
      <div class="hush" id="hush"></div>
    </div>
  </div>
</div>
<script src="capacitor.js"></script>
<script src="version.js"></script>
<script src="data.js"></script>
<script src="sync-config.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
